<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Single Word Search Demo</title>
    <link rel="stylesheet" href="../demo-styles.css">
    <link rel="stylesheet" href="styles.css">

    <script defer src="../node_modules/ff-web-components/dist/bundle.js"></script>
    <script>
        document.addEventListener(`ffCoreReady`, ({factfinder, init, initialSearch}) => {
            init({
                ff: {
                    url: `https://ng-search-web-components.fact-finder.de/fact-finder`,
                    channel: `demo-bergfreunde-en`,
                    apiKey: `ffng-BWelwbv3.ieETzxJkOtmNCRQ3VBr0POJngqDEyZ`,
                },
                appConfig: {
                    formatting: {
                        locale: `de-DE`,
                        formatOptions: {
                            style: `currency`,
                            currency: `EUR`,
                        },
                    },
                },
            });

            initialSearch({query: `helmet crocs purple`});
        });
    </script>
</head>

<body>

<header>
    <ff-searchbox use-suggest="false">
        <input placeholder="Search..."/>
        <ff-searchbutton>
            <button>Search</button>
        </ff-searchbutton>
    </ff-searchbox>
</header>

<ff-single-word-search unresolved>
    <h1>
        <span id="singleWordSearchCaption">For parts of your search the following products could be found:</span>
    </h1>

    <ff-single-word-search-record>
        <h1 data-search="singleWord">{{word}} ({{totalHits}}) </h1>
        <ff-record-list unresolved>
            <template data-role="record">
                <ff-record style="max-width: 20%">
                    <img style="width: 170px;height: 170px" data-image="https://showcase.ff-labs.de/demoshop-images/{{variantValues.0.ImageName}}">
                    <a data-anchor="https://www.your.webshop{{variantValues.0.Deeplink}}"
                       data-redirect="https://www.your.webshop{{variantValues.0.Deeplink}}"
                       data-redirect-target="_blank">
                        {{variantValues.0.Title}}
                    </a>

                    <div class="priceContainer">
                        <span class="brand">{{variantValues.0.Manufacturer}}</span>
                        <span class="price">{{$ variantValues.0.Price}}</span>
                    </div>
                </ff-record>
            </template>
        </ff-record-list>
    </ff-single-word-search-record>
</ff-single-word-search>
</body>
</html>
