<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Record List Discounted Prices Demo</title>
    <link rel="stylesheet" href="../assets/demo-styles.css">

    <script defer src="../node_modules/ff-web-components/dist/bundle.js"></script>

    <style>
        ff-record {
            position: relative;
            overflow: hidden;
        }
        div.discount-flag {
            position: absolute;
            top: 12px;
            right: -55px;
            transform: rotate(45deg);
            background-color: orange;
            color: white;
            padding: 1px 0;
        }
        div.discount-flag div {
            padding: 4px 50px;
            border-top: solid 1px white;
            border-bottom: solid 1px white;

        }
    </style>

    <script>
        document.addEventListener(`ffCoreReady`, ({ factfinder, init, initialSearch }) => {
            init({
                ff: {
                    url: `https://ng-search-web-components.fact-finder.de/fact-finder`,
                    channel: `demo-bergfreunde-en`,
                    apiKey: `ffng-BWelwbv3.ieETzxJkOtmNCRQ3VBr0POJngqDEyZ`,
                },
                appConfig: {
                    formatting: {
                        locale: `de-DE`,
                        formatOptions: {
                            style: `currency`,
                            currency: `EUR`,
                        },
                    },
                },
            });

            factfinder.response.transformSearch((result, requestInfoSearch) => {
                // The `HasDiscount` data field in this demo is a string that is either "0" or "1".
                // In the HTML templates we are using conditional rendering which requires actual boolean values.
                // For easier HTML templating, we therefore convert the `HasDiscount` field and add it to the result data.

                result.hits.forEach(hit => {
                    // Each `hit` receives a new field with the converted `HasDiscount` value.
                    // We only do this for the first variant here because we are not displaying other variants anyway.
                    hit.variantValues[0]._hasDiscountBool = hit.variantValues[0].HasDiscount === `1`;
                });

                return result;
            });

            initialSearch({ query: `equipment` });
        });
    </script>
</head>
<body>

<div class="searchbar">
    <ff-searchbox use-suggest="false">
        <input placeholder="Search..." autofocus />
        <ff-searchbutton>
            <button>
                <span class="icon-search"></span>
            </button>
        </ff-searchbutton>
    </ff-searchbox>
</div>

<ff-record-list unresolved>
    <template data-role="record">
        <ff-record>
            <a data-anchor="https://www.your.webshop{{variantValues.0.Deeplink}}"
               data-redirect="https://www.your.webshop{{variantValues.0.Deeplink}}" data-redirect-target="_blank">
                <div class="record-img">
                    <img data-image="https://showcase.ff-labs.de/demoshop-images/{{variantValues.0.ImageName}}"
                         alt="{{variantValues.0.Title}}" />
                </div>
                <div class="record-product-info">
                    <h3 class="record-product-name">
                        {{variantValues.0.Title}}
                    </h3>
                    <div class="record-product-brand">{{variantValues.0.Manufacturer}}</div>

                    <!-- Conditional rendering based on a custom data field that we added in a pipeline listener. -->
                    {{#if variantValues.0._hasDiscountBool}}
                    <div class="record-product-price" style="text-decoration: line-through; color: red;">{{$ variantValues.0.Old_Price}}</div>
                    <div class="record-product-price">{{$ variantValues.0.Price}}</div>
                    {{else}}
                    <div class="record-product-price">{{$ variantValues.0.Price}}</div>
                    {{/if}}
                </div>
            </a>

            <!-- An additional visual clue when an item is discounted. -->
            {{#if variantValues.0._hasDiscountBool}}
            <div class="discount-flag"><div>Discount</div></div>
            {{/if}}
        </ff-record>
    </template>
</ff-record-list>

</body>
</html>
