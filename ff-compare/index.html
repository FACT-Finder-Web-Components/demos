<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>ff-compare Demo</title>
    <link rel="stylesheet" href="../assets/demo-styles.css">

    <script defer src="../node_modules/ff-web-components/dist/bundle.js"></script>

    <style>
        ff-record-list {
            display: block;
        }

        .controls {
            margin-bottom: 2em;
        }

        .ffw-compare-diff {
            color: red;
            border: 1px solid red;
            font-weight: bold;
        }

        .ffw-compare-equal {
            color: green;
        }

        .selected {
            background: #FFE6E6;
            border: 1px solid black;
        }
    </style>
    <script>
        document.addEventListener(`ffCoreReady`, ({ factfinder, init, initialSearch }) => {
            init({
                ff: {
                    url: `https://ng-search-web-components.fact-finder.de/fact-finder`,
                    channel: `demo-bergfreunde-en`,
                    apiKey: `ffng-BWelwbv3.ieETzxJkOtmNCRQ3VBr0POJngqDEyZ`,
                },
                appConfig: {
                    formatting: {
                        locale: `de-DE`,
                        formatOptions: {
                            style: `currency`,
                            currency: `EUR`,
                        },
                    },
                },
            });

            initialSearch({ query: `jacket` });
        });

        function resetCompare() {
            const records = document.querySelectorAll(`#selectList > .selected`);
            records.forEach(function (rec) {
                rec.classList.remove(`selected`);
            });
            document.querySelector(`#selectList`).style.display = `block`;
            document.querySelector(`#compareList`).style.display = `none`;
        }

        function doCompare() {
            const ids = [];
            const records = document.querySelectorAll(`#selectList > .selected`);

            // While FactFinder allows compare-requests with fewer than two items, it is nonsensical therefore we prevent them early.
            if (records.length < 2) {
                alert(`Must select at least two items.`);
                return;
            }

            records.forEach(function (rec) {
                ids.push(rec.recordData.variantValues[0].ArticleNumber);
            });

            const compareElement = document.querySelector(`#compareList`);
            compareElement.compareRecords(ids);

            document.querySelector(`#selectList`).style.display = `none`;
            document.querySelector(`#compareList`).style.display = `block`;
        }

        function toggleCompareRecord(rec) {
            rec.classList.toggle(`selected`);
        }
    </script>
</head>
<body>

<div class="searchbar">
    <ff-searchbox use-suggest="false">
        <input placeholder="Search..." autofocus />
        <ff-searchbutton>
            <button>
                <span class="icon-search"></span>
            </button>
        </ff-searchbutton>
    </ff-searchbox>
</div>

<ff-record-list id="selectList" unresolved>
    <div class="controls">
        <h2>Select Records to compare</h2>
        <button onclick="doCompare()">Compare</button>
    </div>
    <template data-role="record">
        <ff-record onclick="toggleCompareRecord(this)">
            <div class="record-img">
                <img data-image="https://showcase.ff-labs.de/demoshop-images/{{variantValues.0.ImageName}}">
            </div>
            <div class="record-product-info">
                <h3 class="record-product-name">
                    {{variantValues.0.Title}}
                </h3>
                <div data-attribute="BaseSize" class="record-product-brand">Size: {{variantValues.0.BaseSize}}</div>
                <div class="record-product-price">{{$ variantValues.0.Price}}</div>
            </div>
        </ff-record>
    </template>
</ff-record-list>

<ff-compare max-results="5" id="compareList" style="display: none" unresolved>
    <div class="controls">
        <h2>Compared Records</h2>
        <p>(Compared by the Fields "Manufacturer" and "BaseSize")</p>
        <button onclick="resetCompare()">Reset Compare</button>
    </div>
    <ff-record-list class="compareList" subscribe="false" unresolved>
        <template data-role="record">
            <ff-record>
                <a data-anchor="https://www.your.webshop{{values.Deeplink}}"
                   data-redirect="https://www.your.webshop{{values.Deeplink}}" data-redirect-target="_blank">
                    <div class="record-img">
                        <img data-image="https://showcase.ff-labs.de/demoshop-images/{{values.ImageName}}">
                    </div>
                    <div class="record-product-info">
                        <h3 class="record-product-name">
                            {{values.Title}}
                        </h3>
                        <div data-attribute="Manufacturer" class="record-product-brand">{{values.Manufacturer}}</div>
                        <div data-attribute="BaseSize" class="record-product-brand">Size: {{values.BaseSize}}</div>
                        <div data-attribute="Price" class="record-product-price">{{$ values.Price}}</div>
                    </div>
                </a>
            </ff-record>
        </template>
    </ff-record-list>
</ff-compare>

</body>
</html>
