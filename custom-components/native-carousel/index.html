<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Custom Element Carousel</title>
    <script defer src="../../node_modules/ff-web-components/dist/bundle.js"></script>
    <script src="carousel.js"></script>
    <link rel="stylesheet" href="../carousel.css">
    <script>
        document.addEventListener(`ffCoreReady`, ({factfinder, init, initialSearch}) => {
            init({
                ff: {
                    url: `https://ng-search-web-components.fact-finder.de/fact-finder`,
                    channel: `demo-bergfreunde-en`,
                    apiKey: `ffng-BWelwbv3.ieETzxJkOtmNCRQ3VBr0POJngqDEyZ`,
                },
                appConfig: {
                    formatting: {
                        locale: `de-DE`,
                        formatOptions: {
                            style: `currency`,
                            currency: `EUR`,
                        },
                    },
                },
            });

            initialSearch({ query: `jacket` });
        });
    </script>
</head>
<body>
<ffc-carousel query="hat" class="hats-carousel"></ffc-carousel>
<ff-record-list>
    <template data-role="record">
        <ff-record>
            <a data-anchor="https://www.your.webshop{{variantValues.0.Deeplink}}"
               data-redirect="https://www.your.webshop{{variantValues.0.Deeplink}}"
               data-redirect-target="_blank"
               class="product">
                <img data-image="{{variantValues.0.ImageURL}}" alt="{{variantValues.0.Title}}">
                <div class="title">{{variantValues.0.Title}}</div>
                <div class="price">{{$ variantValues.0.Price}}</div>
            </a>
        </ff-record>
    </template>
</ff-record-list>
<ffc-carousel query="shoe" class="shoes-carousel"></ffc-carousel>
</body>
</html>
