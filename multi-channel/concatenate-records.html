<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Multi-Channel Concatenated Records</title>
    <link rel="stylesheet" href="../assets/demo-styles.css">

    <script defer src="../node_modules/ff-web-components/dist/bundle.js"></script>

    <style>
        body {
            width: 1040px;
        }
        main {
            display: flex;
            padding: 0 10px;
        }
        .filters {
            flex: 0 0;
            width: 240px;
            margin-right: 10px;
        }
        .products-listing {
            flex: 1 0;
        }
        .controls {
            display: flex;
            justify-content: space-between;
            padding-left: 10px;
            margin-bottom: 2rem;
        }

        ff-searchbox {
            border-color: #b9b9b9;
        }

        ff-sortbox {
            border: 1px solid #b9b9b9;
            min-width: 200px;
            position: relative;
        }
        ff-sortbox[opened] .ffw-dropdown-container {
            border: 1px solid #b9b9b9;
            left: -1px;
            right: -1px;
        }
        ff-sortbox-item {
            padding: 10px;
            min-width: 200px;
        }
        ff-sortbox[opened] .ffw-dropdown-container ff-sortbox-item:hover {
            color: #2c72ac;
        }
        ff-sortbox-item.ffw-selected {
            font-weight: bold;
            min-width: 200px;
        }

        ff-paging-item {
            padding: 10px;
        }
        ff-paging-item:hover {
            color: #2c72ac;
        }

        ff-products-per-page-list {
            border: 1px solid #b9b9b9;
        }
        ff-products-per-page-list .ffw-selected {
            font-weight: bold;
        }
        ff-products-per-page-item {
            padding: 10px;
        }
        ff-products-per-page-item:hover {
            color: #2c72ac;
        }

        ff-record-list {
            margin-right: -10px;
        }
        ff-record {
            position: relative;
        }
        ff-record .tag-secondary {
            position: absolute;
            top: 120px;
            transform: rotate(-15deg);
            width: 100%;
            text-align: center;
            text-shadow: 1px 1px #f00;
        }
    </style>

    <script>
        document.addEventListener(`ffCoreReady`, ({ factfinder, init, initialSearch }) => {

            // List of secondary channels that shall be queried with every search request.
            // Any number of channels works.
            // Results will be appended to the primary channel's results in the order of this list.
            const secondaryChannels = [
                `magento2-factfinder`,
            ];

            init({
                ff: {
                    url: `https://ng-search-web-components.fact-finder.de/fact-finder`,
                    channel: `demo-bergfreunde-en`,
                    apiKey: `ffng-rCJ5fQU3.U9CLWqZX4iVphCT0JEL9OsvduPJLe9`,
                },
                appConfig: {
                    formatting: {
                        locale: `de-DE`,
                        formatOptions: {
                            style: `currency`,
                            currency: `EUR`,
                        },
                    },
                },
            });

            factfinder.request.before.search(requestInfoSearch => {
                const { searchParams, searchOptions } = requestInfoSearch;

                // Take care not to re-trigger the manual requests. This would create an infinite loop.
                if (searchOptions.requestOptions?.origin === `manual`) return true;

                // We dispatch the response manually, therefore no request may pass through the response pipeline automatically.
                searchOptions.requestOptions.requestOnly = true;
                // Using `origin` as a marker for the before-handlers that get invoked after issuing our manual search requests.
                searchOptions.requestOptions.origin = `manual`;

                // The two channels in this demo have different default settings for `hitsPerPage`.
                // Usually, `hitsPerPage` does not appear in `searchParams` when the default value is used. Therefore, we force the value here.
                searchParams.hitsPerPage = searchParams.hitsPerPage || 12;

                Promise.all([
                    // The request to the primary channel.
                    factfinder.request.search(searchParams, searchOptions),

                    // The requests to the secondary channels are built here.
                    ...secondaryChannels.map(channel => {
                        const secondarySearchOptions = JSON.parse(JSON.stringify(searchOptions));

                        secondarySearchOptions.requestOptions.channel = channel;

                        // Some optimizations to improve performance. We are only interested in the responses' `hits` anyway.
                        secondarySearchOptions.searchControlParams = Object.assign({}, secondarySearchOptions.searchControlParams, {
                            useAsn: false,
                            useCampaigns: false,
                        });

                        return factfinder.request.search(searchParams, secondarySearchOptions).then(result => {
                            // The secondary channel in this demo has different data fields which we adjust here to the primary channel's schema.
                            // This is so we don't have to distinguish the data's origin in ff-record-list's HTML template.
                            result.hits.forEach(hit => {
                                hit.variantValues[0].Title = hit.masterValues.Name;
                                hit.variantValues[0].Price = hit.masterValues.Price;
                                hit._channel = channel;
                            });
                            return result;
                        });
                    }),
                ]).then(([...results]) => {
                    const primaryResult = results[0];

                    // Concatenation of the results, the main goal of this demo, happens here.
                    primaryResult.hits = results.reduce((hits, result) => hits.concat(result.hits), []);

                    factfinder.response.dispatch.search(primaryResult, { searchParams, searchOptions });
                });

                // We cancel the initial search request because we just reissued it manually above.
                return false;
            });

            initialSearch({ query: `shirt` });
        });
    </script>
</head>

<body>

<div class="searchbar">
    <ff-searchbox use-suggest="false">
        <input placeholder="Search..." autofocus />
        <ff-searchbutton>
            <button>
                <span class="icon-search"></span>
            </button>
        </ff-searchbutton>
    </ff-searchbox>
</div>

<main>
    <div class="filters">
        <ff-asn unresolved></ff-asn>
    </div>
    <div class="products-listing">
        <div class="controls">
            <ff-sortbox unresolved></ff-sortbox>
            <ff-paging unresolved>
                <ff-paging-item type="currentLink -2">{{page}}</ff-paging-item>
                <ff-paging-item type="currentLink -1">{{page}}</ff-paging-item>
                <ff-paging-item type="currentLink" style="font-weight: bold;">{{page}}</ff-paging-item>
                <ff-paging-item type="currentLink +1">{{page}}</ff-paging-item>
                <ff-paging-item type="currentLink +2">{{page}}</ff-paging-item>
            </ff-paging>
            <ff-products-per-page-list values="12,24,36" unresolved></ff-products-per-page-list>
        </div>

        <ff-record-list subscribe="true" unresolved>
            <template data-role="record">
                <ff-record>
                    <div class="record-img">
                        {{#unless _channel}}
                        {{! Images for the secondary channel are not accessible from this demo. }}
                        <img data-image="https://showcase.ff-labs.de/demoshop-images/{{variantValues.0.ImageName}}"
                             alt="{{variantValues.0.Title}}">
                        {{/unless}}
                    </div>
                    <div class="record-product-info">
                        <h3 class="record-product-name">
                            {{variantValues.0.Title}}
                        </h3>

                        {{#unless _channel}}
                        {{! The secondary channel's dataset in this demo does not have a Manufacturer field. }}
                        <div class="record-product-brand">{{variantValues.0.Manufacturer}}</div>
                        {{/unless}}

                        <div class="record-product-price">{{$ variantValues.0.Price}}</div>
                    </div>
                    {{#if _channel}}
                    <div class="tag-secondary">From secondary channel</div>
                    {{/if}}
                </ff-record>
            </template>
        </ff-record-list>
    </div>
</main>

</body>
</html>
