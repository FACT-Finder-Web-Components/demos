<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>ff-campaign-product Demo</title>

    <script defer src="../node_modules/ff-web-components/dist/bundle.js"></script>

    <link rel="stylesheet" href="styles.css">
    <link rel="stylesheet" href="../demo-styles.css">
    <script>
        document.addEventListener(`ffCoreReady`, ({factfinder, init, initialSearch}) => {
            init({
                ff: {
                    url: `https://ng-search-web-components.fact-finder.de/fact-finder`,
                    channel: `demo-bergfreunde-en`,
                    apiKey: `ffng-BWelwbv3.ieETzxJkOtmNCRQ3VBr0POJngqDEyZ`,
                },
                appConfig: {
                    fieldRoles: {
                        brand: `Manufacturer`,
                        deeplink: `Deeplink`,
                        description: `Description`,
                        ean: `EAN`,
                        imageUrl: `ImageURL`,
                        masterId: `MasterArticleNumber`,
                        price: `Price`,
                        productName: `Title`,
                        productNumber: `ArticleNumber`,
                    },
                    formatting: {
                        locale: `de-DE`,
                        formatOptions: {
                            style: `currency`,
                            currency: `EUR`,
                        },
                    },
                },
            });
        });
    </script>
</head>
<body>

<ff-campaign-pushed-products is-product-campaign unresolved>
    <ff-record-list unresolved subscribe="false">
        <template data-role="record">
            <ff-record style="max-width: 20%">
                <img style="width: 170px; height: 170px" data-image="https://showcase.ff-labs.de/demoshop-images/{{variantValues.0.ImageName}}">
                <a data-anchor="https://www.your.webshop{{variantValues.0.Deeplink}}"
                   data-redirect="https://www.your.webshop{{variantValues.0.Deeplink}}"
                   data-redirect-target="_blank">
                    {{variantValues.0.Title}}
                </a>

                <div class="priceContainer">
                    <span class="brand">{{variantValues.0.Manufacturer}}</span>
                    <span class="price">{{$ variantValues.0.Price}}</span>
                </div>
            </ff-record>
        </template>
    </ff-record-list>
</ff-campaign-pushed-products>
<ff-campaign-feedbacktext is-product-campaign label="product detail - below product">{{{text}}}</ff-campaign-feedbacktext>

<!-- Add the request at the bottom of the page -->
<ff-campaign-product product-id="502-2446-1711" id-type="productNumber"></ff-campaign-product>
</body>
</html>
