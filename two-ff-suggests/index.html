<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Two Suggests Demo</title>
    <link rel="stylesheet" href="../demo-styles.css">
    <link rel="stylesheet" href="styles.css">

    <script defer src="../node_modules/ff-web-components/dist/bundle.js"></script>

    <script>
        document.addEventListener(`ffCoreReady`, ({ factfinder, init, initialSearch }) => {
            init({
                ff: {
                    url: `https://ng-search-web-components.fact-finder.de/fact-finder`,
                    channel: `demo-bergfreunde-en`,
                    apiKey: `ffng-BWelwbv3.ieETzxJkOtmNCRQ3VBr0POJngqDEyZ`,
                },
                appConfig: {
                    formatting: {
                        locale: `de-DE`,
                        formatOptions: {
                            style: `currency`,
                            currency: `EUR`,
                        },
                    },
                },
            });

            // Cancel all /search and /navigation requests and all clicks on suggestions because they are not needed for this demo.
            factfinder.request.before.search(() => false);
            factfinder.request.before.navigation(() => false);
            factfinder.notifications.addSuggestClickListener(() => false);
        });
    </script>
</head>
<body>

<ff-searchbox id="searchbox1" suggest-onfocus="true">
    <input placeholder="Search box 1" value="shirt" />
</ff-searchbox>

<ff-searchbox id="searchbox2" suggest-onfocus="true">
    <input placeholder="Search box 2" value="climbing" />
</ff-searchbox>

<ff-suggest id="suggest1" for-searchbox="searchbox1" layout="list" unresolved>
    <template data-role="suggestions">
        <!-- You can define different elements which are displayed in the suggest box -->
        <section class="searchTermContainer">
            <div data-container="searchTerm">
                <p class="containerCaption">Search terms</p>
                <ff-suggest-item type="searchTerm">
                    <span>{{{name}}}</span>
                </ff-suggest-item>
            </div>

            <div data-container="category">
                <p class="containerCaption">Categories</p>
                <ff-suggest-item type="category">
                    <span>{{{name}}}</span>
                </ff-suggest-item>
            </div>

            <div data-container="brand">
                <p class="containerCaption">Brands</p>
                <ff-suggest-item type="brand">
                    <span>{{{name}}}</span>
                </ff-suggest-item>
            </div>
        </section>

        <section class="productsContainer">
            <div data-container="productName">
                <p class="containerCaption">Suggested products</p>
                <div>
                    <ff-suggest-item type="productName">
                        <img data-image>
                        <div class="product-center">
                            <div class="product-name">{{{name}}}</div>
                            <div>Shipping</div>
                            <div>Rating</div>
                        </div>
                        <!-- Price and availability-->
                        <div class="product-right">
                            <div class="product-price">{{attributes.Price}}€</div>
                            <div class="product-availabilitytext">{{attributes.availabilitytext}}</div>
                        </div>
                    </ff-suggest-item>
                </div>
            </div>
        </section>
    </template>
</ff-suggest>

<ff-suggest id="suggest2" for-searchbox="searchbox2" layout="list" unresolved>
    <template data-role="suggestions">
        <!-- You can define different elements which are displayed in the suggest box -->
        <section class="searchTermContainer">
            <div data-container="searchTerm">
                <p class="containerCaption">Search terms</p>
                <ff-suggest-item type="searchTerm">
                    <span>{{{name}}}</span>
                </ff-suggest-item>
            </div>

            <div data-container="category">
                <p class="containerCaption">Categories</p>
                <ff-suggest-item type="category">
                    <span>{{{name}}}</span>
                </ff-suggest-item>
            </div>

            <div data-container="brand">
                <p class="containerCaption">Brands</p>
                <ff-suggest-item type="brand">
                    <span>{{{name}}}</span>
                </ff-suggest-item>
            </div>
        </section>

        <section class="productsContainer">
            <div data-container="productName">
                <p class="containerCaption">Suggested products</p>
                <div>
                    <ff-suggest-item type="productName">
                        <img data-image>
                        <div class="product-center">
                            <div class="product-name">{{{name}}}</div>
                            <div>Shipping</div>
                            <div>Rating</div>
                        </div>
                        <!-- Price and availability-->
                        <div class="product-right">
                            <div class="product-price">{{attributes.Price}}€</div>
                            <div class="product-availabilitytext">{{attributes.availabilitytext}}</div>
                        </div>
                    </ff-suggest-item>
                </div>
            </div>
        </section>
    </template>
</ff-suggest>
</body>
</html>
