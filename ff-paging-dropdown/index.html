<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Paging Dropdown Demo</title>
    <link rel="stylesheet" href="../demo-styles.css">

    <script defer src="../node_modules/ff-web-components/dist/bundle.js"></script>

    <style>
        ff-paging-dropdown {
            border: 1px solid grey;
            cursor: pointer;
        }

        ff-paging-dropdown .ffw-paging-dropdown-container {
            border: 1px solid grey;
            margin-left: -1px;
        }

        ff-paging-item .ffw-cursor {
            text-align: center;
            padding: 10px;
        }

        ff-paging-item:hover {
            background-color: lightgray;
        }
    </style>
    <script>
        document.addEventListener(`ffCoreReady`, ({factfinder, init, initialSearch}) => {
            init({
                ff: {
                    url: `https://ng-search-web-components.fact-finder.de/fact-finder`,
                    channel: `demo-bergfreunde-en`,
                    apiKey: `ffng-BWelwbv3.ieETzxJkOtmNCRQ3VBr0POJngqDEyZ`,
                },
                appConfig: {
                    formatting: {
                        locale: `de-DE`,
                        formatOptions: {
                            style: `currency`,
                            currency: `EUR`,
                        },
                    },
                },
            });

            initialSearch({query: "trousers"});
        });
    </script>
</head>
<body>
<div>
    <div id="demo-header">

        <ff-searchbox use-suggest="false">
            <input placeholder="Search..."/>
        </ff-searchbox>

        <div>
            <h2>Paging Dropdown 1</h2>
            <p>This is a simple paging:</p>
            <ff-paging-dropdown show-selected unresolved>
                <ff-paging-item>{{page}}</ff-paging-item>
            </ff-paging-dropdown>
        </div>

        <ff-record-list unresolved>
            <template data-role="record">
                <ff-record>
                    <img data-image="https://showcase.ff-labs.de/demoshop-images/{{variantValues.0.ImageName}}">
                    <a data-anchor="https://www.your.webshop{{variantValues.0.Deeplink}}"
                       data-redirect="https://www.your.webshop{{variantValues.0.Deeplink}}" data-redirect-target="_blank">
                        {{variantValues.0.Title}}
                    </a>

                    <div class="priceContainer"><span class="brand">{{variantValues.0.Manufacturer}}</span> <span class="price">{{$ variantValues.0.Price}}</span>
                    </div>
                </ff-record>
            </template>
        </ff-record-list>
</body>
</html>
