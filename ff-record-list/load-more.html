<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Record List (Load more) Demo</title>
    <link rel="stylesheet" href="../assets/demo-styles.css">
    <script src="../assets/scripts.js"></script>

    <script defer src="../node_modules/ff-web-components/dist/bundle.js"></script>

    <script>
        document.addEventListener(`ffCoreReady`, ({ factfinder, init, initialSearch }) => {
            init({
                ff: {
                    url: `https://ng-search-web-components.fact-finder.de/fact-finder`,
                    channel: `demo-bergfreunde-en`,
                    apiKey: `ffng-BWelwbv3.ieETzxJkOtmNCRQ3VBr0POJngqDEyZ`,
                },
                appConfig: {
                    formatting: {
                        locale: `de-DE`,
                        formatOptions: {
                            style: `currency`,
                            currency: `EUR`,
                        },
                    },
                },
            });

            initialSearch({ query: `cooking`, page: 2 });


            let loadedRecords = [];

            const ffRecordList = document.querySelector(`ff-record-list`);
            const btnPreviousContainer = document.querySelector(`#previous-button`);
            const btnPrevious = btnPreviousContainer.querySelector(`button`);
            const btnNextContainer = document.querySelector(`#next-button`);
            const btnNext = btnNextContainer.querySelector(`button`);


            factfinder.response.subscribeSearch(result => {
                // This subscription is used for regular search requests, i.e. initial and via search box.
                // It sets up the load next/previous buttons.

                console.log(`Search result (page ${result.paging.currentPage}):`, result.hits);

                loadedRecords = result.hits;
                // Not assigning to ff-record-list here because it already received the data through the default response pipeline.

                btnPrevious._pagingLink = result.paging.previousLink;
                btnNext._pagingLink = result.paging.nextLink;

                btnPreviousContainer.hidden = !btnPrevious._pagingLink;
                btnNextContainer.hidden = !btnNext._pagingLink;
            });

            btnPrevious.addEventListener(`click`, async ({ target }) => {
                target.disabled = true;
                const result = await factfinder.request.search(target._pagingLink.searchParams, { requestOptions: { requestOnly: true }});
                target.disabled = false;

                console.log(`Previous page (${result.paging.currentPage}):`, result.hits);

                // It is important to create a new array instance here or ff-record-list will not notice the change.
                loadedRecords = [...result.hits, ...loadedRecords];
                ffRecordList.records = loadedRecords;

                target._pagingLink = result.paging.previousLink;
                btnPreviousContainer.hidden = !result.paging.previousLink;
            });

            btnNext.addEventListener(`click`, async ({ target }) => {
                target.disabled = true;
                const result = await factfinder.request.search(target._pagingLink.searchParams, { requestOptions: { requestOnly: true }});
                target.disabled = false;

                console.log(`Next page (${result.paging.currentPage}):`, result.hits);

                // It is important to create a new array instance here or ff-record-list will not notice the change.
                loadedRecords = [...loadedRecords, ...result.hits];
                ffRecordList.records = loadedRecords;

                target._pagingLink = result.paging.nextLink;
                btnNextContainer.hidden = !result.paging.nextLink;
            });
        });
    </script>

    <style>
        .load-more {
            margin-top: 1rem;
            margin-bottom: 1rem;
            text-align: center;
        }

        .load-more button {
            width: 40%;
            padding: .375rem .75rem;
            background-color: #004587;
            border: 1px solid #004587;
            line-height: 1.25rem;
            color: #fff;
            text-align: center;
            vertical-align: middle;
            user-select: none;
            cursor: pointer;
        }

        .load-more button:hover {
            background-color: #003669;
        }
    </style>
</head>
<body>

<div class="searchbar">
    <ff-searchbox use-suggest="false">
        <input placeholder="Search..." autofocus />
        <ff-searchbutton>
            <button>
                <span class="icon-search"></span>
            </button>
        </ff-searchbutton>
    </ff-searchbox>
</div>

<div id="previous-button" class="load-more" hidden>
    <button>Load previous</button>
</div>

<ff-record-list unresolved>
    <template data-role="record">
        <ff-record>
            <a data-anchor="https://www.your.webshop{{variantValues.0.Deeplink}}"
               data-redirect="https://www.your.webshop{{variantValues.0.Deeplink}}" data-redirect-target="_blank">
                <div class="record-img">
                    <img data-image="https://showcase.ff-labs.de/demoshop-images/{{variantValues.0.ImageName}}">
                </div>
                <div class="record-product-info">
                    <h3 class="record-product-name">
                        {{variantValues.0.Title}}
                    </h3>
                    <div class="record-product-brand">{{variantValues.0.Manufacturer}}</div>
                    <div class="record-product-price">{{$ variantValues.0.Price}}</div>
                </div>
            </a>
            <div class="record-product-add-to-cart">
                <button onclick="addToCart(event)">Add to Cart</button>
            </div>
        </ff-record>
    </template>
</ff-record-list>

<div id="next-button" class="load-more" hidden>
    <button>Load next</button>
</div>

</body>
</html>
