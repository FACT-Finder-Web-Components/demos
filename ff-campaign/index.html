<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Campaign Demo</title>
    <link rel="stylesheet" href="../demo-styles.css">
    <link rel="stylesheet" href="styles.css">

    <script defer src="../node_modules/ff-web-components/dist/bundle.js"></script>
    <script>
        document.addEventListener(`ffCoreReady`, ({factfinder, init, initialSearch}) => {
            init({
                ff: {
                    url: `https://ng-search-web-components.fact-finder.de/fact-finder`,
                    channel: `demo-bergfreunde-en`,
                    apiKey: `ffng-BWelwbv3.ieETzxJkOtmNCRQ3VBr0POJngqDEyZ`,
                },
                appConfig: {
                    formatting: {
                        locale: `de-DE`,
                        formatOptions: {
                            style: `currency`,
                            currency: `EUR`,
                        },
                    },
                },
            });
        });

        function searchFor(query) {
            const searchBox = document.querySelector(`ff-searchbox`);
            searchBox.value = query;
            searchBox.search();
        }
    </script>
</head>
<body>

<ff-searchbox use-suggest="false">
    <input placeholder="Search..."/>
    <ff-searchbutton>
        <button>Search</button>
    </ff-searchbutton>
</ff-searchbox>

<ff-campaign-feedbacktext unresolved label="below searchbox">
    <p>This is a banner campaign configured in the FactFinder UI. Its label is "below searchbox".</p>
    {{{text}}}
</ff-campaign-feedbacktext>

<br>
<button onclick="searchFor('jacket')">Search for 'jacket'</button>
<button onclick="searchFor('shirts')">Search for 'shirts'</button>
<button onclick="searchFor('backpack')">Search for 'backpack'</button>

<ff-campaign-advisor unresolved name="Jackets">
    <p> The "Jackets" advisor campaign.</p>
    <ff-campaign-advisor-question>
        <span><h1 data-question>{{{text}}}</h1></span>
        <!--OR when plain text-->
        <!-- {{text}} -->
        <div class="answers">
            <ff-campaign-advisor-answer>
                {{{text}}}
            </ff-campaign-advisor-answer>
        </div>
    </ff-campaign-advisor-question>
</ff-campaign-advisor>

<!-- For the campaign 'Shirts' use this advisor-->
<ff-campaign-advisor unresolved not="Jackets">
    <style>
        .gifts-answers {
            background-color: #0d47a1;
            color: white;
            font-weight: bold;
            border-radius: 5px;
            width: 100px;
            text-align: center;
            float: left;
            margin: 20px;
            padding: 10px;
        }
        .gifts-answers-box {
            margin-left: auto;
            margin-right: auto;
            width: 500px;
        }
    </style>

    <p>Any advisor campaign except the one named "Jackets"</p>

    <ff-campaign-advisor-question>
        <span><h1 data-question>{{{text}}}</h1></span>
        <div class="gifts-answers-box">
            <ff-campaign-advisor-answer class="gifts-answers">
                <div>
                    {{{text}}}
                </div>
            </ff-campaign-advisor-answer>
        </div>
    </ff-campaign-advisor-question>
</ff-campaign-advisor>


<!--
    This is a placeholder for a feedback which should be placed over the Product's.
    In this special case the feedback is a plain Text and not a HTML. So you can style the Feedback how you like.
-->
<style>
    .aboveProductsFeedback {
        background-color: #00b0ff;
        border-radius: 5px;
        padding: 5px 10px;
        margin-left: auto;
        margin-right: auto;
        width: 800px;
        text-align: center;
    }
</style>
<ff-campaign-feedbacktext unresolved label="above search result">
    <div class="aboveProductsFeedback">
    <p>Banner campaign labelled "above search result"</p>
        {{{text}}}
    </div>
</ff-campaign-feedbacktext>

<ff-record-list unresolved>
    <template data-role="record">
        <ff-record>
            <img data-image="https://showcase.ff-labs.de/demoshop-images/{{variantValues.0.ImageName}}">
            <a data-anchor="https://www.your.webshop{{variantValues.0.Deeplink}}"
               data-redirect="https://www.your.webshop{{variantValues.0.Deeplink}}"
               data-redirect-target="_blank">
                {{variantValues.0.Title}}
            </a>

            <div class="priceContainer">
                <span class="brand">{{variantValues.0.Manufacturer}}</span>
                <span class="price">{{$ variantValues.0.Price}}</span>
            </div>
        </ff-record>
    </template>
</ff-record-list>
</body>
</html>
