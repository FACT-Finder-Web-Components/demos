<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Two Channel Suggest Demo</title>
    <link rel="stylesheet" href="../assets/demo-styles.css">

    <script defer src="../node_modules/ff-web-components/dist/bundle.js"></script>
    <script>
        const cmsChannel = `magento2-factfinder`;
        const secondarySuggestOrigin = `secondary-suggest`;

        document.addEventListener(`ffCoreReady`, ({factfinder, init, initialSearch}) => {
            init({
                ff: {
                    url: `https://ng-search-web-components.fact-finder.de/fact-finder`,
                    channel: `demo-bergfreunde-en`,
                    apiKey: `ffng-rCJ5fQU3.U9CLWqZX4iVphCT0JEL9OsvduPJLe9`,
                },
                appConfig: {
                    formatting: {
                        locale: `de-DE`,
                        formatOptions: {
                            style: `currency`,
                            currency: `EUR`,
                        },
                    }
                },
            });

            // initialSearch({ query: `wome` });

            let secondarySuggestPromise; // each ff-suggest-triggered request sets secondary suggest result promise

            factfinder.request.before.suggest(async ({suggestParams, requestOptions}) => {
                console.log(`before`, requestOptions);

                if (requestOptions.origin !== secondarySuggestOrigin) {
                    secondarySuggestPromise = factfinder.request.suggest({query: suggestParams.query}, {
                        channel: cmsChannel,
                        requestOnly: true,
                        origin: secondarySuggestOrigin,
                    });
                }
            });

            // after dispatching the main suggestions, wait for CMS suggestions and re-dispatch them combined
            factfinder.response.subscribeSuggest(async (suggestionResult, requestInfo) => {
                console.log(`subscr`, suggestionResult, requestInfo?.requestOptions);

                if (requestInfo && requestInfo.requestOptions.origin !== secondarySuggestOrigin) {
                    console.log(`same subscr: primary`);

                    const cmsSuggestions = await secondarySuggestPromise;
                    cmsSuggestions.suggestions.forEach(s => s.type = `content`);
                    suggestionResult.suggestions = suggestionResult.suggestions.concat(cmsSuggestions.suggestions);
                    // factfinder.response.dispatch.suggest(suggestionResult);
                    document.querySelector(`ff-suggest`).suggestItems = suggestionResult.suggestions;
                }
            });
        });
    </script>
</head>
<body>
<div class="searchbar">
    <ff-searchbox>
        <input placeholder="Search..." value="jac" autofocus />
        <ff-searchbutton>
            <button>
                <span class="icon-search"></span>
            </button>
        </ff-searchbutton>
    </ff-searchbox>


    <ff-suggest layout="block" unresolved>
        <section id="searchContainer" class="search-terms-container">
            <div data-container="searchTerm">
                <h2 class="container-caption">Search terms</h2>
                <ff-suggest-item type="searchTerm">
                    <span>{{{name}}}</span>
                </ff-suggest-item>
            </div>

            <div data-container="category">
                <h2 class="container-caption">Categories</h2>
                <ff-suggest-item type="category">
                    <span>{{{name}}}</span>
                </ff-suggest-item>
            </div>

            <div data-container="brand">
                <h2 class="container-caption">Brands</h2>
                <ff-suggest-item type="brand">
                    <span>{{{name}}}</span>
                </ff-suggest-item>
            </div>

            <div data-container="content">
                <h2 class="container-caption">Content</h2>
                <ff-suggest-item type="content">
                    <span>{{{name}}}</span>
                </ff-suggest-item>
            </div>
        </section>

        <section id="productContainer" class="products-container">
            <div data-container="productName">
                <h2 class="container-caption">Products</h2>
                <div class="suggest-images">
                    <ff-suggest-item type="productName">
                        <div class="product-image">
                            <img data-image>
                        </div>
                        <div class="product-info">
                            <div class="product-name">{{{name}}}</div>
                        </div>
                    </ff-suggest-item>
                </div>
            </div>
            <div class="all-results-container">
                <ff-searchbutton>
                    <button>Show all results</button>
                </ff-searchbutton>
            </div>
        </section>
    </ff-suggest>
</div>
</body>
</html>
