<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>ASN Demo</title>
    <link rel="stylesheet" href="../assets/demo-styles.css">

    <script defer src="../node_modules/ff-web-components/dist/bundle.js"></script>

    <style>
        main {
            display: flex;
            align-items: flex-start;
        }
        ff-asn {
            flex-shrink: 0;
        }
        ff-record-list {
            justify-content: center;
        }
    </style>

    <script>
        document.addEventListener(`ffCoreReady`, ({ factfinder, init, initialSearch }) => {
            init({
                ff: {
                    url: `https://ng-search-web-components.fact-finder.de/fact-finder`,
                    channel: `demo-bergfreunde-en`,
                    apiKey: `ffng-BWelwbv3.ieETzxJkOtmNCRQ3VBr0POJngqDEyZ`,
                },
                appConfig: {
                    formatting: {
                        locale: `de-DE`,
                        formatOptions: {
                            style: `currency`,
                            currency: `EUR`,
                        },
                    },
                },
            });

            factfinder.response.transformSearch((result, requestInfoSearch) => {
                const spliced = result.facets.splice(4, Infinity);

                document.querySelector(`#asn-secondary`).asnGroups = spliced;

                return result;
            });

            initialSearch({ query: `trousers` });
        });
    </script>
</head>
<body>

<div class="searchbar">
    <ff-searchbox use-suggest="false">
        <input placeholder="Search..." autofocus />
        <ff-searchbutton>
            <button>
                <span class="icon-search"></span>
            </button>
        </ff-searchbutton>
    </ff-searchbox>
</div>

<div class="bctContainer">
    <p>You are searching for: <ff-breadcrumb-trail unresolved></ff-breadcrumb-trail></p>
</div>

<main>
    <ff-asn>
        <ff-asn-group filter-style="TREE" opened collapsible="false"></ff-asn-group>
        <ff-asn-group opened></ff-asn-group>
    </ff-asn>

    <ff-record-list unresolved>
        <template data-role="record">
            <ff-record>
                <a data-anchor="https://www.your.webshop{{variantValues.0.Deeplink}}"
                   data-redirect="https://www.your.webshop{{variantValues.0.Deeplink}}"
                   data-redirect-target="_blank">
                    <div class="record-img">
                        <img data-image="https://showcase.ff-labs.de/demoshop-images/{{variantValues.0.ImageName}}">
                    </div>
                    <div class="record-product-info">
                        <h3 class="record-product-name">
                            {{variantValues.0.Title}}
                        </h3>
                        <div class="record-product-brand">{{variantValues.0.Manufacturer}}</div>
                        <div class="record-product-price">{{$ variantValues.0.Price}}</div>
                    </div>
                </a>
            </ff-record>
        </template>
    </ff-record-list>

    <ff-asn id="asn-secondary" subscribe="false" unresolved>
        <ff-asn-group></ff-asn-group>
        <ff-asn-group-slider></ff-asn-group-slider>
    </ff-asn>
</main>
</body>
</html>
