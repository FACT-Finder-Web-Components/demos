<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Recommendation Demo</title>
    <link rel="stylesheet" href="../demo-styles.css">
    <link rel="stylesheet" href="styles.css">

    <script>
        document.addEventListener(`ffCoreReady`, ({factfinder, init, initialSearch}) => {
            init({
                ff: {
                    url: `https://ng-search-web-components.fact-finder.de/fact-finder`,
                    channel: `demo-bergfreunde-en`,
                    apiKey: `ffng-BWelwbv3.ieETzxJkOtmNCRQ3VBr0POJngqDEyZ`,
                },
                appConfig: {
                    formatting: {
                        locale: `de-DE`,
                        formatOptions: {
                            style: `currency`,
                            currency: `EUR`,
                        },
                    },
                },
            });

            initialSearch({query: `backpack`});

            // not related to ff-recommendation; this transformer just trims search result
            factfinder.response.transformSearch(result => {
                result.hits = result.hits.slice(0, 8);
                return result;
            });

            factfinder.response.subscribeSearch(result => {
                const productRecord = result.hits.find(hit => hit.variantValues?.length > 0); // skip teasers
                if (productRecord) {
                    document.querySelector(`ff-recommendation`).productNumber = productRecord.variantValues[0].ArticleNumber;
                }
            });
        });

        function setRecommendationProduct(ffRecordElement) {
            if (ffRecordElement.recordData.variantValues?.length > 0) { // skip teasers
                document.querySelector("ff-recommendation").productNumber = ffRecordElement.recordData.variantValues[0].ArticleNumber;
            }
        }
    </script>

    <script defer src="../node_modules/ff-web-components/dist/bundle.js"></script>
</head>
<body>

<ff-searchbox use-suggest="false">
    <input placeholder="Search..."/>
    <ff-searchbutton><button>Search</button></ff-searchbutton>
</ff-searchbox>

<p><b>Info</b>: Click on a product in the <i>Search result</i> to reload the Recommendations for that
    product.</p>

<ff-recommendation unresolved max-results="4">
    <div class="recommendationHeader">Recommendations</div>
    <ff-record-list unresolved>
        <template data-role="record">
            <ff-record style="max-width: 20%">
                <img style="width: 170px;height: 170px" data-image="https://showcase.ff-labs.de/demoshop-images/{{variantValues.0.ImageName}}">
                <a data-anchor="https://www.your.webshop{{variantValues.0.Deeplink}}"
                   data-redirect="https://www.your.webshop{{variantValues.0.Deeplink}}" data-redirect-target="_blank">
                    {{variantValues.0.Title}}
                </a>

                <div class="priceContainer">
                    <span class="brand">{{variantValues.0.Manufacturer}}</span>
                    <span class="price">{{$ variantValues.0.Price}}</span>
                </div>
            </ff-record>
        </template>
    </ff-record-list>
</ff-recommendation>

<ff-record-list unresolved>
    <template data-role="record">
        <ff-record onclick="setRecommendationProduct(this)">
            <img data-image="https://showcase.ff-labs.de/demoshop-images/{{variantValues.0.ImageName}}">
            <a data-anchor="https://www.your.webshop{{variantValues.0.Deeplink}}"
               data-redirect="https://www.your.webshop{{variantValues.0.Deeplink}}" data-redirect-target="_blank">
                {{variantValues.0.Title}}
            </a>

            <div class="priceContainer">
                <span class="brand">{{variantValues.0.Manufacturer}}</span>
                <span class="price">{{$ variantValues.0.Price}}</span>
            </div>
        </ff-record>
    </template>
</ff-record-list>
</body>
</html>
